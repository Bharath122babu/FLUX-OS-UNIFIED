name: Python tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q -rs
      - run: fluxos unified-demo
      - run: fluxos benchmark
      - run: python scripts/shared_memory_stress.py
      - name: Prepare real Docker runtime images
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: |
          docker pull python:3.12-alpine
          docker pull node:22-alpine
      - name: Real Docker acceptance and project reuse
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.12'
        run: python scripts/docker_acceptance_smoke.py
