[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxos-hackday"
version = "0.6.0"
description = "Backend-only causal coding agent harness with sealed acceptance and conditional shared-memory edits"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.30", "httpx>=0.27", "pydantic>=2.7"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
fluxos = "fluxos.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
